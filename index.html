<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastVid - Custom Backend Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background-color: #151c2c;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      color: #3b82f6;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dropdown-row {
      display: flex;
      gap: 12px;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      border: 1px solid #334155;
    }

    input, select {
      background-color: #0f172a;
      color: #ffffff;
      outline: none;
    }

    .dropdown-row select {
      flex: 1;
    }

    button {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }

    button:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .download-btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      background-color: #10b981;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 12px;
    }

    /* Progress Bar CSS */
    .progress-wrapper {
      margin-top: 20px;
      text-align: center;
    }
    
    .progress-container {
      width: 100%;
      background-color: #2d3748;
      border-radius: 20px;
      height: 26px;
      overflow: hidden;
      margin-top: 8px;
      position: relative;
      border: 1px solid #334155;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 20px;
    }

    .progress-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">FastVid</div>
    <div class="subtitle">Powered by Custom Cloud Backend</div>

    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="Paste YouTube link here..." autocomplete="off">
      
      <div class="dropdown-row">
        <select id="mediaType" onchange="updateQualityOptions()">
          <option value="mp4">Video (MP4)</option>
          <option value="mp3">Audio (MP3)</option>
        </select>

        <select id="qualitySelect">
          <!-- Populated automatically -->
        </select>
      </div>

      <button id="submitBtn" onclick="startDownload()">Download Now</button>
    </div>

    <div id="progressWrapper" class="progress-wrapper" style="display: none;">
      <div id="progressLabel">Connecting to your Render server...</div>
      <div class="progress-container">
        <div id="pBar" class="progress-bar"></div>
        <div id="pText" class="progress-text">0%</div>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // ==========================================
    // ⚠️ REPLACE THIS WITH YOUR RENDER.COM URL
    // ==========================================
    const BACKEND_URL = 'https://fastvid-backend-rhaq.onrender.com/';
    // ==========================================

    function updateQualityOptions() {
      const type = document.getElementById('mediaType').value;
      const qSelect = document.getElementById('qualitySelect');
      qSelect.innerHTML = ''; 
      
      if (type === 'mp4') {
        const options = [
          { val: '1080', text: '1080p (FHD)' },
          { val: '720', text: '720p (HD)' },
          { val: '480', text: '480p (SD)' },
          { val: '360', text: '360p (Low)' }
        ];
        options.forEach(opt => qSelect.options.add(new Option(opt.text, opt.val)));
        qSelect.value = '720'; 
      } else {
        const options = [
          { val: 'mp3', text: 'Audio (MP3)' } // yt-dlp backend handles audio extraction
        ];
        options.forEach(opt => qSelect.options.add(new Option(opt.text, opt.val)));
      }
    }
    
    window.onload = updateQualityOptions;

    // --- Loading Animation ---
    let progressTimer = null;
    let currentP = 0;

    function startProgressEngine() {
      clearInterval(progressTimer);
      currentP = 0;
      
      const pBar = document.getElementById('pBar');
      const pText = document.getElementById('pText');
      pBar.style.width = '0%';
      pText.innerText = '0%';

      progressTimer = setInterval(() => {
        if (currentP < 95) {
          currentP += Math.floor(Math.random() * 4) + 1;
          if (currentP > 95) currentP = 95; // Stop at 95% until server replies
        }
        pBar.style.width = currentP + '%';
        pText.innerText = currentP + '%';
      }, 150);
    }

    function completeProgressEngine() {
      clearInterval(progressTimer);
      document.getElementById('pBar').style.width = '100%';
      document.getElementById('pText').innerText = '100%';
      document.getElementById('progressLabel').innerText = 'File Ready!';
    }

    // --- Download Logic ---
    function extractVideoID(url) {
      if (!url) return null;
      const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    function triggerDirectDownload(fileUrl, mediaType) {
      const ext = mediaType === 'mp3' ? 'mp3' : 'mp4';
      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = `fastvid_download.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function startDownload() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      const mediaType = document.getElementById('mediaType').value;
      const qualityValue = document.getElementById('qualitySelect').value;
      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');

      if (!urlInput) {
        statusDiv.innerHTML = '<span style="color: #ef4444;">Please paste a YouTube link.</span>';
        return;
      }

      if (!extractVideoID(urlInput)) {
        statusDiv.innerHTML = '<span style="color: #ef4444;">Invalid YouTube link format.</span>';
        return;
      }

      // Check if user forgot to change the backend URL
      if (BACKEND_URL.includes("YOUR_RENDER_APP_NAME")) {
        statusDiv.innerHTML = '<span style="color: #ef4444;">Configuration Error: Please update the BACKEND_URL in your HTML code with your actual Render link.</span>';
        return;
      }

      statusDiv.innerHTML = '';
      submitBtn.disabled = true;
      document.getElementById('progressWrapper').style.display = 'block';
      document.getElementById('progressLabel').innerText = 'Extracting stream via custom server...';
      
      startProgressEngine();

      // Hit your own custom backend
      const targetUrl = `${BACKEND_URL}/download?url=${encodeURIComponent(urlInput)}&format=${qualityValue}`;

      try {
        const response = await fetch(targetUrl);
        const data = await response.json();

        if (data.success && data.downloadUrl) {
          completeProgressEngine();
          
          setTimeout(() => {
            document.getElementById('progressWrapper').style.display = 'none';
            statusDiv.innerHTML = `
              <a href="${data.downloadUrl}" class="download-btn" target="_blank" rel="noopener noreferrer">
                ⬇️ Click to Download ${mediaType === 'mp3' ? 'MP3' : 'MP4'}
              </a>
            `;
            triggerDirectDownload(data.downloadUrl, mediaType);
            submitBtn.disabled = false;
          }, 600);
          
        } else {
          clearInterval(progressTimer);
          document.getElementById('progressWrapper').style.display = 'none';
          statusDiv.innerHTML = `<span style="color: #ef4444;">Server Error: ${data.error || 'Failed to extract link.'}</span>`;
          submitBtn.disabled = false;
        }
      } catch (error) {
        clearInterval(progressTimer);
        document.getElementById('progressWrapper').style.display = 'none';
        statusDiv.innerHTML = '<span style="color: #ef4444;">Connection failed. Ensure your Render server is awake and running.</span>';
        submitBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
